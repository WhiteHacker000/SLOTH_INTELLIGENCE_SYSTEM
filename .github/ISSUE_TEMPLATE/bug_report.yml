name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected behavior and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible set of steps. Remove secrets and private data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant OS, Python/Node versions, and commands.
    validations:
      required: false
