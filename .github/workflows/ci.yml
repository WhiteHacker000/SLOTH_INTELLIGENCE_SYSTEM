name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci_test
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
        working-directory: backend
      - name: Lint backend
        run: |
          ruff check .
          ruff format --check .
        working-directory: backend
      - name: Start PostgreSQL with pgvector
        run: |
          PG_MAJOR=$(ls /usr/lib/postgresql | sort -n | tail -1)
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-${PG_MAJOR}-pgvector"
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE ROLE ci LOGIN SUPERUSER PASSWORD 'ci'"
          sudo -u postgres createdb -O ci ci_test
      - name: Run migrations
        run: |
          alembic upgrade head
          alembic check
        working-directory: backend
      - name: Run backend tests
        run: python -m pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
      - name: Run frontend tests
        run: npm test
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
